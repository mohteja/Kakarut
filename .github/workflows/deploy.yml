name: Deploy manual (darurat)

# JALUR DARURAT SAJA — sengaja TANPA gerbang CI.
#
# Deploy produksi yang NORMAL hidup di `ci.yml`, sebagai job `deploy` yang
# ber-`needs: [quality, verify-api]`. Berkas ini dulu memicu dirinya sendiri
# lewat `on: push: branches: [production]`, sehingga berjalan BERSAMAAN dengan
# CI, bukan sesudahnya: image ter-build dan Dokploy ter-picu selagi
# typecheck/unit test/verify-api masih berjalan — dan tetap ter-deploy walau
# ketiganya kemudian merah.
#
# Pemicu push itu DIHAPUS. Yang tersisa hanya tombol manual, untuk keadaan
# ketika produksi harus diperbaiki lebih cepat daripada satu putaran CI penuh.
# Memakainya berarti sengaja melewati verifikasi — itu keputusan sadar, bukan
# bawaan yang tak sengaja.
on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Peringatan jalur darurat
        run: |
          echo "::warning::Deploy manual TANPA gerbang CI. Jalur normal (ci.yml → job deploy) menunggu typecheck, unit test, dan verify-api hijau."

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login ke GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata (nama & tag image)
        id: meta
        uses: docker/metadata-action@v5
        with:
          # github.repository -> mohteja/Kakarut; di-lowercase otomatis oleh action.
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Picu redeploy Dokploy (opsional)
        env:
          DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
        run: |
          if [ -n "$DOKPLOY_WEBHOOK_URL" ]; then
            echo "Memicu redeploy Dokploy..."
            curl -fsSL -X POST "$DOKPLOY_WEBHOOK_URL"
          else
            echo "Secret DOKPLOY_WEBHOOK_URL kosong; lewati. (Dokploy juga bisa auto-deploy via webhook/registry watch.)"
          fi
