name: Build & Deploy (production)

# Build image saat push ke branch production, push ke GHCR, lalu (opsional)
# picu redeploy di Dokploy lewat webhook.
on:
  push:
    branches: [production]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login ke GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata (nama & tag image)
        id: meta
        uses: docker/metadata-action@v5
        with:
          # github.repository -> mohteja/Kakarut; di-lowercase otomatis oleh action.
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Picu redeploy Dokploy (opsional)
        env:
          DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
        run: |
          if [ -n "$DOKPLOY_WEBHOOK_URL" ]; then
            echo "Memicu redeploy Dokploy..."
            curl -fsSL -X POST "$DOKPLOY_WEBHOOK_URL"
          else
            echo "Secret DOKPLOY_WEBHOOK_URL kosong; lewati. (Dokploy juga bisa auto-deploy via webhook/registry watch.)"
          fi
