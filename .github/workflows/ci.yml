name: CI

# Jaring pengaman tiap PR (dan push ke production): typecheck + unit test +
# build web, lalu verifikasi API end-to-end (scripts/verify-api.sh) terhadap
# database Postgres segar. Menangkap regresi sebelum merge.
on:
  pull_request:
  push:
    branches: [production]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Typecheck + unit test + build web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck (shared/server/web)
        run: npm run typecheck
      - name: Unit test (server)
        run: npm test
      - name: Build web
        run: npm run build -w @kakarut/web

  verify-api:
    name: Verify API end-to-end (DB segar)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kakarut
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/kakarut
      JWT_SECRET: ci-secret-bukan-untuk-produksi
      PORT: "3000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Build SPA dulu: server mengambil build-id dari apps/web/dist saat boot,
      # dan verify-api §61 memverifikasi build-id di /api/health + header.
      - name: Build web (untuk build-id + uji SPA produksi)
        run: npm run build -w @kakarut/web
      - name: Jalankan server (auto-migrate) + seed + verify-api
        run: |
          set -euo pipefail
          # Server boot menjalankan migrasi otomatis (AUTO_MIGRATE default aktif).
          npm run start -w @kakarut/server > /tmp/server.log 2>&1 &
          echo "$!" > /tmp/server.pid
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/api/health >/dev/null 2>&1; then
              echo "Server sehat setelah ${i}s"; break
            fi
            sleep 1
          done
          curl -sf http://localhost:3000/api/health
          npm run seed
          bash scripts/verify-api.sh
      - name: Log server bila gagal
        if: failure()
        run: tail -n 200 /tmp/server.log || true

  # ───────────────────────────────────────────────────────────────────────────
  # DEPLOY PRODUKSI — DIGERBANGI CI, dan itulah alasan ia tinggal di sini.
  #
  # Sebelumnya ini workflow terpisah (`deploy.yml`) yang juga dipicu
  # `on: push: branches: [production]`. Dua workflow yang dipicu peristiwa yang
  # sama berjalan BERSAMAAN, bukan berurutan: image ter-build dan Dokploy
  # ter-picu selagi typecheck/unit test/verify-api masih berjalan — dan tetap
  # ter-deploy walau ketiganya kemudian MERAH. Satu-satunya penahannya adalah
  # seseorang yang kebetulan sedang melihat tab Actions.
  #
  # Tak ada pengaman lain di belakangnya: branch `production` TIDAK diproteksi
  # (diperiksa lewat API: `protected: false`), jadi tak ada required status
  # check yang menahan apa pun.
  #
  # KENAPA `needs:` DAN BUKAN `workflow_run`: pemicu `workflow_run` membaca
  # berkas workflow dari BRANCH DEFAULT, dan default repo ini `main` sementara
  # rilis berjalan di `production` — keduanya commit yang berbeda. Gerbang yang
  # ditulis di `production` akan diabaikan diam-diam karena yang dieksekusi
  # versi `main`. `needs:` bekerja di dalam satu run pada ref yang benar-benar
  # dipush, jadi tak ada celah itu.
  #
  # Jalur darurat tetap ada: `deploy.yml` sekarang HANYA `workflow_dispatch` —
  # deploy manual, sengaja tanpa gerbang, dan tertulis begitu di sana.
  deploy:
    name: Build image & deploy produksi
    needs: [quality, verify-api]
    if: github.event_name == 'push' && github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login ke GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata (nama & tag image)
        id: meta
        uses: docker/metadata-action@v5
        with:
          # github.repository -> mohteja/Kakarut; di-lowercase otomatis oleh action.
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Picu redeploy Dokploy (opsional)
        env:
          DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
        run: |
          if [ -n "$DOKPLOY_WEBHOOK_URL" ]; then
            echo "Memicu redeploy Dokploy..."
            curl -fsSL -X POST "$DOKPLOY_WEBHOOK_URL"
          else
            echo "Secret DOKPLOY_WEBHOOK_URL kosong; lewati. (Dokploy juga bisa auto-deploy via webhook/registry watch.)"
          fi
