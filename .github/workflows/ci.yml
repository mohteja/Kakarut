name: CI

# Typecheck + unit test + build web, lalu verifikasi API end-to-end
# (scripts/verify-api.sh) terhadap database Postgres segar.
#
# HANYA push ke `production` — pemicu `pull_request` sengaja dilepas atas
# permintaan pemilik repo untuk menekan pemakaian menit Actions.
#
# KONSEKUENSINYA HARUS DIKETAHUI SIAPA PUN YANG MENYENTUH BERKAS INI: job
# `deploy` di bawah digerbangi `needs: [quality, verify-api]` DI DALAM run yang
# sama, jadi commit yang merah tetap tidak akan ter-deploy. Yang hilang bukan
# gerbang deploy-nya, melainkan peringatan DINI: kegagalan kini baru terlihat
# SESUDAH commit mendarat di `production`, bukan sebelum merge.
#
# Itu bukan risiko teoretis di repo ini. Delapan PR yang masing-masing hijau
# pernah menghasilkan satu kegagalan saat digabung — yang menangkapnya justru
# pemeriksaan sebelum merge. Tanpa pemicu `pull_request`, kasus seperti itu
# harus ditangkap dengan menjalankan suite lokal pada hasil MERGE-nya sebelum
# mendorong ke `production`:
#
#   git checkout production && git merge --no-ff <cabang>
#   npm run typecheck && npm test && npm run build -w @kakarut/web
#   bash scripts/dev-db.sh && npm run db:migrate && npm run seed
#   npm run start -w @kakarut/server &   # lalu:
#   bash scripts/verify-api.sh
#
# `workflow_dispatch` disediakan supaya suite ini masih bisa dijalankan atas
# permintaan pada cabang mana pun tanpa harus mendorongnya ke `production`.
on:
  push:
    branches: [production]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Typecheck + unit test + build web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck (shared/server/web)
        run: npm run typecheck
      - name: Unit test (server)
        run: npm test
      - name: Build web
        run: npm run build -w @kakarut/web

  verify-api:
    name: Verify API + E2E web (DB segar)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kakarut
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/kakarut
      JWT_SECRET: ci-secret-bukan-untuk-produksi
      PORT: "3000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Build SPA dulu: server mengambil build-id dari apps/web/dist saat boot,
      # dan verify-api §61 memverifikasi build-id di /api/health + header.
      - name: Build web (untuk build-id + uji SPA produksi)
        run: npm run build -w @kakarut/web
      - name: Jalankan server (auto-migrate) + seed + verify-api
        run: |
          set -euo pipefail
          # Server boot menjalankan migrasi otomatis (AUTO_MIGRATE default aktif).
          # JEJAK_RUTE: tiap permintaan dicatat (metode, POLA rute, status, ms)
          # supaya langkah "Cakupan rute" di bawah bisa MENGUKUR ULANG
          # docs/audit/rute-diketuk.txt alih-alih mempercayainya.
          JEJAK_RUTE=/tmp/jejak-rute.tsv npm run start -w @kakarut/server > /tmp/server.log 2>&1 &
          echo "$!" > /tmp/server.pid
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/api/health >/dev/null 2>&1; then
              echo "Server sehat setelah ${i}s"; break
            fi
            sleep 1
          done
          curl -sf http://localhost:3000/api/health
          npm run seed
          bash scripts/verify-api.sh
      # ─────────────────────────────────────────────────────────────────────
      # AUDIT INVARIAN — SESUDAH verify-api, dan itu seluruh alasannya.
      #
      # Basis data ini cuma punya delapan `CHECK` untuk 59 tabel; selebihnya
      # invarian hidup di kode. Uji satuan memeriksa PENJAGANYA; audit ini
      # memeriksa DATANYA — dan datanya baru bermakna sesudah 2.700+ asersi
      # melewatinya lewat rute sungguhan: penjualan, refund, transfer, opname,
      # produksi, sinkron offline, kosongkan sampah.
      #
      # Menjalankannya di basis data yang baru di-seed tak menyatakan apa-apa.
      # ─────────────────────────────────────────────────────────────────────
      # ─────────────────────────────────────────────────────────────────────
      # CAKUPAN RUTE — rekamannya diukur ulang, bukan dipercaya.
      #
      # `docs/audit/rute-diketuk.txt` menuliskan rute mana yang benar-benar
      # diketuk verify-api (271 dari 274 saat ditulis). Gerbang
      # `cakupan-rute.test.ts` menjaganya, tapi ia menulis batasnya sendiri:
      # "rute-diketuk.txt adalah REKAMAN, bukan pengukuran ulang — bila sebuah
      # rute berhenti diketuk tanpa berkasnya diperbarui, gerbangnya tetap
      # hijau." Langkah ini menutup batas itu: jejak run INI dibandingkan
      # dengan rekamannya, jadi §244 (atau seksi mana pun) tak bisa dicabut
      # diam-diam tanpa CI merah.
      # ─────────────────────────────────────────────────────────────────────
      - name: Cakupan rute — jejak run ini vs rekaman yang di-commit
        run: |
          set -euo pipefail
          npx tsx apps/server/src/scripts/cakupan-rute.ts /tmp/jejak-rute.tsv > /tmp/rute-diketuk-ci.txt
          if ! diff -u docs/audit/rute-diketuk.txt /tmp/rute-diketuk-ci.txt; then
            echo
            echo "Rekaman cakupan tak lagi cocok dengan kenyataan run ini."
            echo "Baris '-' = rute yang BERHENTI diketuk (seksi verify-api-nya"
            echo "dicabut/berubah); baris '+' = rute baru yang kini diketuk."
            echo "Perbarui rekamannya DENGAN SADAR:"
            echo "  npx tsx apps/server/src/scripts/cakupan-rute.ts <jejak> > docs/audit/rute-diketuk.txt"
            exit 1
          fi
          echo "Cakupan cocok: $(wc -l < /tmp/rute-diketuk-ci.txt) rute diketuk, sama dengan rekaman."

      - name: Audit invarian basis data (sesudah semua rute dilewati)
        run: npm run --silent audit:invarian -w @kakarut/server
      # ─────────────────────────────────────────────────────────────────────
      # E2E WEB — di job yang SAMA, dan itu disengaja.
      #
      # Suite Playwright butuh persis lingkungan yang sudah berdiri di sini:
      # server hidup + database ter-seed + SPA ter-build. Job sendiri berarti
      # Postgres kedua, `npm ci` kedua, dan build web kedua — biaya menit
      # Actions yang justru ditekan di berkas ini (lihat catatan di kepala).
      #
      # SESUDAH verify-api, bukan sebelum: verify-api menuntut cacah yang
      # PERSIS (mis. "jumlah menu = 57", saldo stok tertentu), jadi menjalankan
      # e2e lebih dulu — yang membuat dua penjualan sungguhan — akan
      # menggesernya. Sebaliknya tidak: spec e2e sudah dibuat tahan terhadap
      # keadaan sisa (mejanya dikosongkan sendiri, shift dibuka hanya bila
      # belum terbuka).
      #
      # KENAPA BARU SEKARANG: suite ini sudah ada di repo tapi TAK PERNAH
      # dijalankan CI, dan karena itu membusuk tanpa ada yang tahu — 4 dari 5
      # spec merah karena layarnya berubah (kasir kini wajib absen + buka
      # shift, checkout jadi dua langkah, struk dirender portal cetak).
      # Uji yang tak pernah dijalankan bukan jaring pengaman, cuma berkas.
      - name: Pasang Chromium untuk Playwright
        run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: E2E web (Playwright)
        run: npx playwright test
        working-directory: apps/web
      - name: Log server bila gagal
        if: failure()
        run: tail -n 200 /tmp/server.log || true

  # ───────────────────────────────────────────────────────────────────────────
  # DEPLOY PRODUKSI — DIGERBANGI CI, dan itulah alasan ia tinggal di sini.
  #
  # Sebelumnya ini workflow terpisah (`deploy.yml`) yang juga dipicu
  # `on: push: branches: [production]`. Dua workflow yang dipicu peristiwa yang
  # sama berjalan BERSAMAAN, bukan berurutan: image ter-build dan Dokploy
  # ter-picu selagi typecheck/unit test/verify-api masih berjalan — dan tetap
  # ter-deploy walau ketiganya kemudian MERAH. Satu-satunya penahannya adalah
  # seseorang yang kebetulan sedang melihat tab Actions.
  #
  # Tak ada pengaman lain di belakangnya: branch `production` TIDAK diproteksi
  # (diperiksa lewat API: `protected: false`), jadi tak ada required status
  # check yang menahan apa pun.
  #
  # KENAPA `needs:` DAN BUKAN `workflow_run`: pemicu `workflow_run` membaca
  # berkas workflow dari BRANCH DEFAULT, dan default repo ini `main` sementara
  # rilis berjalan di `production` — keduanya commit yang berbeda. Gerbang yang
  # ditulis di `production` akan diabaikan diam-diam karena yang dieksekusi
  # versi `main`. `needs:` bekerja di dalam satu run pada ref yang benar-benar
  # dipush, jadi tak ada celah itu.
  #
  # Jalur darurat tetap ada: `deploy.yml` sekarang HANYA `workflow_dispatch` —
  # deploy manual, sengaja tanpa gerbang, dan tertulis begitu di sana.
  deploy:
    name: Build image & deploy produksi
    needs: [quality, verify-api]
    if: github.event_name == 'push' && github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login ke GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata (nama & tag image)
        id: meta
        uses: docker/metadata-action@v5
        with:
          # github.repository -> mohteja/Kakarut; di-lowercase otomatis oleh action.
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Picu redeploy Dokploy (opsional)
        env:
          DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
        run: |
          if [ -n "$DOKPLOY_WEBHOOK_URL" ]; then
            echo "Memicu redeploy Dokploy..."
            curl -fsSL -X POST "$DOKPLOY_WEBHOOK_URL"
          else
            echo "Secret DOKPLOY_WEBHOOK_URL kosong; lewati. (Dokploy juga bisa auto-deploy via webhook/registry watch.)"
          fi
