# Deploy di Dokploy memakai image hasil build GitHub Actions (GHCR).
# DB PostgreSQL eksternal (Neon/Supabase/VPS) — isi DATABASE_URL di env Dokploy.
# Upload gambar ke Cloudflare R2 — isi R2_* di env Dokploy (tanpa volume disk).
#
# Variabel diisi lewat panel Environment Dokploy (di-interpolasi dari .env stack).
services:
  app:
    image: ghcr.io/mohteja/kakarut:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"

      # Wajib.
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-12h}

      # Jalankan seed sekali saat deploy pertama (set true), lalu kembalikan false.
      RUN_SEED: ${RUN_SEED:-false}

      # ASAL KANONIK + tautan email. KOSONGNYA BUKAN NETRAL: tanpa ini base URL
      # tautan verifikasi/reset password diturunkan dari header permintaan, yang
      # dikendalikan PEMINTA — permintaan reset ber-Host palsu membuat surat
      # korban menunjuk domain penyerang, lengkap dengan token yang masih hidup.
      # Panel super admin menandainya KRITIS; sampai kunci ini ada di sini,
      # temuan itu tak bisa dipadamkan dari panel Dokploy.
      APP_BASE_URL: ${APP_BASE_URL:-}
      APP_HOST_DIPERCAYA: ${APP_HOST_DIPERCAYA:-}

      # Berapa proxy di depan aplikasi. Bawaan 1 cocok dengan stack ini (satu
      # Traefik). Naikkan ke 2 bila ada CDN di depannya — salah angka berarti
      # alamat klien salah, dan batas percobaan login ikut salah.
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      # Sakelar darurat; biarkan kosong agar bawaannya (aktif) berlaku.
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-}
      # Migrasi in-process saat boot. Kosong = aktif. Setel false untuk deploy
      # yang sengaja tak boleh menyentuh skema.
      AUTO_MIGRATE: ${AUTO_MIGRATE:-}

      # Cloudflare R2 (penyimpanan upload).
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET: ${R2_BUCKET}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL}

      # BUCKET CADANGAN — PRIVAT, DAN TERPISAH DARI BUCKET UNGGAHAN.
      # Bila kosong, cadangan jatuh ke R2_BUCKET dengan prefiks `backups/` —
      # bucket yang SAMA dengan yang dilayani publik lewat R2_PUBLIC_URL. Nama
      # objeknya `backups/kakarut-<stempel waktu>.jsonl.gz`, dan stempel itu
      # bisa ditebak: seluruh basis data platform jadi sejauh satu tebakan nama
      # berkas. Aplikasi memang tak pernah memulangkan URL publik untuk
      # cadangan — tapi yang melayani bucket publik bukan aplikasi.
      R2_BACKUP_BUCKET: ${R2_BACKUP_BUCKET:-}

      # Pencadangan otomatis (semuanya opsional; bawaan di config/env.ts).
      BACKUP_ENABLED: ${BACKUP_ENABLED:-}
      BACKUP_HOUR: ${BACKUP_HOUR:-}
      BACKUP_TIMEZONE: ${BACKUP_TIMEZONE:-}
      BACKUP_KEEP: ${BACKUP_KEEP:-}
      BACKUP_ALERT_DAYS: ${BACKUP_ALERT_DAYS:-}

      # Pengirim email cadangan bila SMTP belum diatur di panel super admin.
      RESEND_API_KEY: ${RESEND_API_KEY:-}

      # Override kredensial seed (opsional; default ada di config/env.ts).
      SEED_SUPERADMIN_EMAIL: ${SEED_SUPERADMIN_EMAIL:-}
      SEED_SUPERADMIN_PASSWORD: ${SEED_SUPERADMIN_PASSWORD:-}
      SEED_OWNER_EMAIL: ${SEED_OWNER_EMAIL:-}
      SEED_OWNER_PASSWORD: ${SEED_OWNER_PASSWORD:-}
      SEED_KASIR_EMAIL: ${SEED_KASIR_EMAIL:-}
      SEED_KASIR_PASSWORD: ${SEED_KASIR_PASSWORD:-}
      # Bawaannya AKTIF: seed membuat stok demo. Setel false untuk deploy
      # pertama yang datanya sungguhan.
      SEED_DEMO_STOCK: ${SEED_DEMO_STOCK:-}
    expose:
      - "3000"
    # ports:
    #   - "3000:3000"
    # Traefik (Dokploy) hanya mengarahkan trafik ke container SEHAT, dan Docker
    # baru menjalankan cek pertama setelah `interval` berlalu. Interval pendek
    # membuat container baru dinyatakan sehat dalam hitungan detik — jendela
    # "404 page not found" saat re-deploy menyusut dari ±40-60 dtk ke ±5-10 dtk.
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "require('http').get('http://127.0.0.1:3000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

# Swarm TIDAK membuat jaringan `default` secara implisit.
#
# `docker compose` biasa selalu menyediakan `default` tanpa diminta. Dokploy
# menjalankan `docker stack deploy` (mode Swarm), dan di sana aturannya berbeda:
# jaringan hanya dibuat kalau dideklarasikan. Saat menyiapkan rilis, Dokploy
# menyuntikkan `networks: [dokploy-network, default]` ke service ini — bersama
# label Traefik dari tab Domains — tapi yang didefinisikannya hanya
# `dokploy-network`. Rujukan `default` jadi menggantung, dan deploy berhenti di:
#
#   failed to create service ..._app-terakasir:
#   network terakasir-all-service-<id>_default not found
#
# Mendefinisikannya di sini membuat jaringan itu benar-benar dibuat. Driver
# `overlay` wajib: Swarm menolak `bridge` untuk service multi-node.
networks:
  default:
    driver: overlay
